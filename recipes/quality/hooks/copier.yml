_subdirectory: template
_answers_file: .copier-answers.hooks.yml

_scaffold:
  summary: >-
    The root .pre-commit-config.yaml, the repo-wide hygiene and commit-message
    hooks, the binaries they call, and the recipe that folds every
    .pre-commit.d fragment into the root config.
  requires_bin: [git]
  after: [base/repo, lang/*]

# The root config is generated from .pre-commit.d/, so it is not skip-guarded:
# re-rendering has to rebuild it. A direct edit is lost work, and the header
# written into the file says so.

hook_exclude_patterns:
  type: yaml
  help: >-
    Regex patterns joined into the config's top-level exclude. A generated or
    vendored directory belongs here rather than in each hook's own exclude.
  default: []

max_file_kb:
  type: int
  help: >-
    Reject a staged file larger than this, in kilobytes. Guards against a
    committed binary or a captured log.
  default: 500

commit_scopes:
  type: yaml
  help: >-
    Allowed Conventional Commits scopes. Empty allows any scope and drops
    `--force-scope`, since an allowlist permitting everything only misleads.
  default: []

# The merge runs from the copy in the generated project, not a second copy here, so
# the recipe and the render cannot fold fragments differently.
#
# It runs last, after every other layer has contributed its fragment. Re-rendering
# a language layer needs the merge again, and `just hooks-install` and
# `just hooks-all` both run it first.
_tasks:
  # Through uv for the same reason hooks-merge is: merge_hooks.py imports yaml, and
  # `scaffold update` re-runs tasks with the destination's ambient python3.
  - >-
    uv run --no-project --with pyyaml
    python3 "{{ _copier_conf.dst_path }}/scripts/merge_hooks.py"
    "{{ _copier_conf.dst_path }}"
  # Said at render time, because the empty default is deliberate and silent: a
  # scaffold guessing a scope vocabulary teaches people --no-verify on day one,
  # but a team that never hears about the allowlist never adopts one either.
  - >-
    {% if not commit_scopes %}python3 -c "print('quality/hooks: commit scopes are
    unrestricted. Once a vocabulary settles, list it in commit_scopes and
    re-render, and the commit-msg hook will enforce it.')"{% else %}true{% endif %}
