_subdirectory: template
_answers_file: .copier-answers.apm.yml

_scaffold:
  summary: >-
    apm.yml naming the marketplaces and the package set, plus the .just.d and
    .gitignore.d fragments the aggregating layers fold in.
  requires_bin: [git]
  # base/repo supplies project_name and the description. base/gitignore and
  # workspace/just aggregate what this contributes, so both follow it.
  after: [base/repo]
  # A repository is either a package publisher or a package consumer: both this
  # and agentic/package own apm.yml, so `scaffold check` refuses a profile
  # naming both.
  exclusive_group: apm-manifest

_skip_if_exists:
  - apm.yml

project_name:
  type: str
  help: the project name, used as apm.yml's name field.
  default: ""

description:
  type: str
  help: one line for apm.yml. Empty derives one from project_name.
  default: ""

# An open list rather than choices: this layer carries no package catalog. Each
# entry is a locator shaped owner/repo/packages/name#constraint.
#
# Unlike bailiff's version there is no validator refusing the empty list. A
# repository can want the marketplaces seeded and pick its packages later, and
# `agentic/marketplace` recommends against the rendered layer set afterwards.
apm_packages:
  type: yaml
  help: >-
    APM package locators shaped owner/repo/packages/name#constraint.
  default: []

apm_target:
  type: str
  help: comma-separated harnesses `apm install` deploys to.
  default: "claude,codex"

apm_cli_version:
  type: str
  help: >-
    APM CLI version the install pins in `uvx --from`. An unpinned CLI would change
    what a re-render installs.
  default: "0.25.0"

# `apm install` is deliberately not a copier task. It reaches the network, needs
# uvx, and fails a render that would otherwise have succeeded. This layer writes the
# manifest, and `just apm-install` performs the install.
