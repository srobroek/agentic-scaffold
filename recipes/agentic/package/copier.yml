_subdirectory: template
_answers_file: .copier-answers.package.yml

_scaffold:
  summary: >-
    A native marketplace repo: one starter plugin under <name>/ carrying a skill and
    the package.json `omp` marker, plus the root .omp-plugin/ and .claude-plugin/
    catalogs that scripts/build_catalog.py assembles from the plugin manifests. OMP
    reads the first and falls back to the second, so one repository serves OMP and
    Claude Code from one source.
  requires_bin: [git]
  # base/repo supplies project_name, description, and author.
  after: [base/repo]

# The plugin's own files become the project's once written: a re-render must not
# overwrite a real skill body, and both manifests carry the version, which release
# tooling or a hand bump owns after the first release. The catalogs are absent here
# because copier does not write them -- the generator does, from a task below, so
# they have exactly one writer.
_skip_if_exists:
  - "{{ package_name or project_name }}/package.json"
  - "{{ package_name or project_name }}/.omp-plugin/plugin.json"
  - "{{ package_name or project_name }}/.claude-plugin/plugin.json"
  - "{{ package_name or project_name }}/skills/{{ package_name or project_name }}/SKILL.md"

project_name:
  type: str
  help: >-
    The repository name, and the marketplace name in every catalog. It is the
    `@<marketplace>` handle in `omp plugin install <plugin>@<marketplace>` and the key
    OMP files the install under, so it has to stay unique across the marketplaces a
    machine has added.
  default: ""

package_name:
  type: str
  help: >-
    The one plugin this repository starts with. Empty uses project_name. It names the
    directory OMP resolves the catalog's `source` against, the plugin manifest, and the
    starter skill.
  default: ""

description:
  type: str
  help: >-
    One line describing the plugin, written into the catalog metadata, both manifests,
    and the skill frontmatter. For a skill this is a retrieval key rather than a
    summary: an agent matches against it to decide whether to load the skill. Empty
    derives a placeholder that says to replace it.
  default: ""

author:
  type: str
  help: Author name, written as the marketplace owner in every catalog.
  default: ""

owner:
  type: str
  help: >-
    GitHub owner of the marketplace, shaped as a person or organisation login. It is
    the first half of `omp plugin marketplace add <owner>/<repo>` and the npm scope in
    the plugin's package.json. Empty derives it from author, lowercased.
  default: ""

# The catalogs are committed generated artefacts: OMP and Claude Code resolve a
# marketplace straight from a clone, so a catalog that exists only after a build is one
# nobody can install from. Generating them here rather than rendering them as templates
# keeps a single writer, which is what makes `just marketplace-check` meaningful --
# a second writer with its own idea of the bytes would report drift that is not drift.
_tasks:
  - >-
    python3 "{{ _copier_conf.dst_path }}/scripts/build_catalog.py"
    "{{ _copier_conf.dst_path }}"
