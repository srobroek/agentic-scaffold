_subdirectory: template
_answers_file: .copier-answers.license.yml

_scaffold:
  summary: LICENSE, and the SPDX identifier other layers read.
  requires_bin: [git, gh]

license:
  type: str
  help: >-
    Licence identifier, fetched through `gh api /licenses`. Policy defaults: a
    niche library is MPL-2.0, an application is AGPL-3.0-only, dev tooling or a
    template is Apache-2.0. Anything GitHub does not carry falls back to the SPDX
    licence list.
  default: Apache-2.0

copyright_name:
  type: str
  help: The copyright holder, as it should appear in LICENSE.
  default: ""

copyright_year:
  type: str
  help: First year of copyright.
  default: "2026"

_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/tasks/write_license.py"
    "{{ _copier_conf.dst_path }}"
    "{{ license }}"
    "{{ copyright_name }}"
    "{{ copyright_year }}"
