_subdirectory: template
_answers_file: .copier-answers.release-please.yml

_scaffold:
  summary: >-
    release-please config, manifest, and workflow. Reads Conventional Commits on the
    default branch and maintains a release pull request.
  requires_bin: [git]
  # The member list comes from the workspace manifest, so monorepo renders first.
  after: [base/repo, workspace/monorepo]

# The manifest records the current version of every package, so release-please owns it
# after the first release. Re-rendering would reset each one to initial_version.
_skip_if_exists:
  - .release-please-manifest.json

release_type:
  type: str
  choices: ["", node, python, rust, go, simple]
  help: >-
    What release-please parses for the version. Empty reads the tree after
    render -- rust-toolchain.toml, pyproject.toml, package.json, go.mod, and
    `simple` where no marker matches. Answer it only for a monorepo publishing
    per-member components, where the root shape lies.
  default: ""

initial_version:
  type: str
  help: version recorded for every package before the first release.
  default: 0.1.0

default_branch:
  type: str
  help: branch the release workflow triggers on.
  default: main

release_app:
  type: bool
  help: >-
    Mint a GitHub App token for the release workflow. A pull request opened with GITHUB_TOKEN
    triggers no workflow, so without this the release pull request reports no checks and a
    required check blocks it. Needs a RELEASE_APP_CLIENT_ID variable and a
    RELEASE_APP_PRIVATE_KEY secret on the repository.
  default: false

sync_generated:
  type: bool
  help: >-
    Regenerate the marketplace catalogs onto the release branch. release-please bumps only
    the files its config names, so a catalog repeating a plugin's version goes stale the
    moment the release pull request opens. Answer yes for a marketplace whose config names
    the plugin manifests; needs `release_app`, since the amending commit has to trigger the
    required checks.
  default: false

# Empty means a single-package repository. A monorepo passes the member directories,
# which `just release-sync` reads from the workspace manifest rather than asking twice.
release_packages:
  type: yaml
  help: >-
    Package directories relative to the repository root, as a YAML list. Empty releases
    the repository as one package.
  default: []

_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/tasks/detect_release_type.py"
    "{{ _copier_conf.dst_path }}"
    "{{ release_type }}"
