_subdirectory: template
_answers_file: .copier-answers.gitlab.yml

_scaffold:
  summary: >-
    GitLab CI and governance: .gitlab-ci.yml with the stages list and the glob
    include, the language-blind quality and security jobs, CODEOWNERS, and the issue
    and merge-request templates.
  requires_bin: [git]
  # Every lang/* layer drops a .gitlab/ci/<lang>.yml the include resolves, and the
  # stages list has to name what those fragments declare.
  after: [base/repo, lang/*]

# Each carries a contact address or a project-specific rule edited after rendering.
_skip_if_exists:
  - .gitlab/CODEOWNERS
  - SECURITY.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md

gitlab_host:
  type: str
  help: >-
    GitLab instance hostname. A self-managed instance has to mirror any CI component
    the pipeline uses, since components resolve from the instance they run on.
  default: gitlab.com

security_contact:
  type: str
  help: >-
    Where to report a vulnerability privately. Empty points at a confidential issue,
    which is the only private channel a GitLab project has by default.
  default: ""

coc_contact:
  type: str
  help: >-
    Where to report a code-of-conduct violation. Empty renders no
    CODE_OF_CONDUCT.md at all: a code of conduct with no reporting channel asks
    people to trust a process that does not exist.
  default: ""

default_branch:
  type: str
  help: branch the pipeline treats as protected.
  default: main

job_timeout_minutes:
  type: int
  help: >-
    Per-job timeout. GitLab's own default comes from the runner rather than the job,
    so a hung job can run to the project limit without one here.
  default: 15

project_name:
  type: str
  help: project name, used in CONTRIBUTING.md's clone line.
  default: ""

org:
  type: str
  help: owning group or user, written into .gitlab/CODEOWNERS.
  default: ""

# The stages list is written by the copy in the generated project, so a language
# layer adopted later cannot leave a fragment declaring a stage the pipeline does not
# name. GitLab fails the whole pipeline on that, rather than skipping the job.
_tasks:
  - >-
    python3 "{{ _copier_conf.dst_path }}/scripts/gen_gitlab_stages.py"
    "{{ _copier_conf.dst_path }}"
