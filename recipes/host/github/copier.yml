_subdirectory: template
_answers_file: .copier-answers.github.yml

_scaffold:
  summary: >-
    GitHub CI and governance: the changes, quality, security, and gate reusable
    workflows, the ci-gate action, CODEOWNERS, issue and pull-request templates,
    and the three community-health files.
  requires_bin: [git]
  after: [base/repo, lang/*]

# All four are edited after the fact -- a contact address, a project-specific
# rule, an owner line -- so a re-render must not overwrite them.
_skip_if_exists:
  - SECURITY.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - .github/CODEOWNERS

default_branch:
  type: str
  help: Branch the gate treats as protected.
  default: main

job_timeout_minutes:
  type: int
  help: >-
    Per-job timeout. GitHub defaults to 360, so a hung job burns six runner hours
    before it is killed.
  default: 15

security_contact:
  type: str
  help: >-
    Where to report a vulnerability privately. Empty points at GitHub's private
    reporting form, which `just repo-govern` enables with the rest of the
    repository settings.
  default: ""

coc_contact:
  type: str
  help: >-
    Where to report a code-of-conduct violation. Empty renders no
    CODE_OF_CONDUCT.md at all: a code of conduct with no reporting channel asks
    people to trust a process that does not exist.
  default: ""

# Threaded by the agent from base/repo rather than read through _external_data.
# Only lang/rust and docs/deploy-* read a sibling layer; every other shared value
# arrives in this layer's answers file.
project_name:
  type: str
  help: Repository name, used in CONTRIBUTING.md's clone line.
  default: ""

org:
  type: str
  help: Owning person or organisation, written into .github/CODEOWNERS.
  default: ""

# The caller is generated rather than shipped: which reusable workflows exist depends on
# which lang/* layers rendered, and this layer renders after them. Run through the copy in
# the generated project, so a render exercises the same script `just ci-sync` does.
#
# `--keep-hand-owned` because a repository may already own its ci.yml, and a copier task
# that fails aborts the whole render.
_tasks:
  - >-
    python3 "{{ _copier_conf.dst_path }}/scripts/gen_caller.py"
    "{{ _copier_conf.dst_path }}"
    --default-branch "{{ default_branch }}"
    --keep-hand-owned
