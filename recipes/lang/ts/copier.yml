_subdirectory: template
_answers_file: .copier-answers.ts.yml

_scaffold:
  summary: >-
    TypeScript tooling: bun, biome for formatting and assists, oxlint for
    type-aware linting, vitest, tsc, knip, plus the CI jobs and the fragments
    every aggregating layer folds in.
  requires_bin: [bun]
  # Only the constraint with a mechanism behind it: the member glob must exist
  # before a language renders into it. No file here depends on base/license, and
  # the cdk shape legitimately renders the licence late (projen owns LICENSE
  # until its re-synth releases it).
  after: [workspace/monorepo]

_skip_if_exists:
  # better-t-stack writes both when it generates the project. Its versions win,
  # and this layer contributes only the fragments and the CI jobs.
  - biome.json
  - tsconfig.json

node_version:
  type: str
  help: Runtime version, for CI and the mise pin.
  default: "24"
# Type-aware oxlint is not an answer. It carries 59 of typescript-eslint's 61
# rules against biome's 4 outside nursery, TypeScript 7 is the floor for a fresh
# scaffold, and add_dev_deps.py installs the oxlint-tsgolint executable the
# config requires.
_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/tasks/add_dev_deps.py"
    "{{ _copier_conf.dst_path }}"
