_subdirectory: template
_answers_file: .copier-answers.cdk.yml

_scaffold:
  summary: >-
    An AWS CDK app owned by projen: .projenrc.ts with the tsx runner and no projen
    workflows, plus the fragments the aggregating layers fold in. projen owns the CDK
    and TypeScript build surface; the layers own CI, hooks, agentic, release, licence.
  requires_bin: [git, node]
  # BEFORE the host layer, not after: `projen new` synthesises its own github
  # component -- read-only workflows and a PR template -- and host/github cannot
  # write .github until the re-synth below, running with this recipe's
  # `github: false`, has removed them. The host layer still owns CI: that is
  # exactly what the re-synth enforces.
  after: [base/repo, lang/ts]

# .projenrc.ts is rendered over the generated default -- `github: false` is the whole
# point -- and hand edits after that are protected by `scaffold update`'s 3-way merge,
# not by a skip. Every file projen generates from it is regenerated rather than
# rendered.

_tasks:
  # Re-synthesise with THIS projenrc. Removes the github component projen's own
  # default enabled, so the host layer can own .github. A render without the
  # generator has no node_modules, and nothing to re-synthesise.
  - >-
    sh -c 'cd "{{ _copier_conf.dst_path }}" &&
    if [ -d node_modules ] && [ -f .projenrc.ts ]; then npx --yes projen;
    else echo "no node_modules; skipping projen re-synth"; fi'

project_name:
  type: str
  help: The CDK app name, written into .projenrc.ts.
  default: ""

default_branch:
  type: str
  help: Branch projen records as the release branch.
  default: main

cdk_version:
  type: str
  help: >-
    aws-cdk-lib version the app pins. projen writes it into package.json rather than
    resolving it at synth time.
  default: "2.262.2"

projen_version:
  type: str
  help: projen version the mise fragment pins, so a synth is reproducible.
  default: "0.101.22"

tsx_version:
  type: str
  help: >-
    tsx version. Required rather than optional: projen's default ts-node runner fails
    under TypeScript 7, verified against ts-node 10.9.2 and TypeScript 7.0.2.
  default: "4.23.1"

node_version:
  type: str
  help: Node version the mise fragment pins.
  default: "24"
