_subdirectory: template
_answers_file: .copier-answers.deploy-sibling.yml

_scaffold:
  summary: >-
    The Pages workflow for a sibling repository that holds the docs source and builds
    itself. The default topology.
  requires_bin: [git]
  after: [docs/site]

_skip_if_exists:
  - .github/workflows/pages.yml

# No pages_repo question. This workflow renders INTO the sibling repository that
# serves the site, so the value it once recorded is the repository the reader is
# already standing in. docs/deploy-split, which pushes ACROSS to the sibling, is
# the recipe that consumes one.

default_branch:
  type: str
  help: branch a push publishes from.
  default: main

job_timeout_minutes:
  type: int
  help: >-
    Per-job timeout. GitHub defaults to 360, so a hung job burns six runner hours.
  default: 15
