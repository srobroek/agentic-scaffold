name: Lint Go

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run in. Set this per member in a monorepo.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # GitHub defaults to 360 minutes, so a hung job burns six runner hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves GITHUB_TOKEN in .git/config, where any later step
          # can read it. zizmor reports the default as a finding.
          persist-credentials: false

      - uses: ./.github/actions/setup-go

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb0f9e6e3b # v9.0.0
        with:
          version: latest
          working-directory: ${{ inputs.working-directory }}

      - name: Tidy
        run: go mod tidy -diff

      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
