_subdirectory: template
_answers_file: .copier-answers.index.yml

_scaffold:
  summary: >-
    repomix.config.json, so the directory map and the full pack are reproducible
    from committed patterns rather than from a wrapper script's arguments.
  requires_bin: [git]
  after: [base/repo]

index_languages:
  type: yaml
  help: >-
    Glob patterns for the languages this repository holds, derived from the lang/*
    layers that rendered. Path filtering is the only lever that works: the content
    flags measured between 0 and a 10.9 percent increase.
  default:
    - "**/*.md"
    - "**/*.toml"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.sh"

index_full_pack:
  type: bool
  help: >-
    Whether to configure a second, contents-bearing pack. It is a grep target
    only, at 6.3 million tokens against the map's 20 thousand. Grepping one file
    is faster than the live tree, measured at 0.018s against 0.126s. The
    token-savings package already guards a whole-file Read of it, so this layer
    ships no hook of its own.
  default: true

index_extra_ignores:
  type: yaml
  help: >-
    Repository-shaped ignores on top of the defaults. Which directories hold
    fixtures or generated output differs per repository, so this is not derivable.
  default: []
