_subdirectory: template
_answers_file: .copier-answers.rtk.yml

_scaffold:
  summary: >-
    `.rtk/filters.toml`, which compacts the output of tools rtk ships no filter for,
    plus the recipes that trust it and turn telemetry off.
  requires_bin: [git]
  after: [base/repo]

# Editing the file revokes its trust, since rtk hashes the content, so a re-render
# replacing a hand-tuned filter would silently stop it working.
_skip_if_exists:
  - .rtk/filters.toml

# The path is fixed, not a preference. `rtk trust` reads project-local filters from the
# current directory and records an absolute path per file; copies under
# `~/.config/rtk/`, `~/Library/Application Support/rtk/`, and `~/.rtk/` are ignored, and
# `rtk verify` stays at its built-in test count, so a misplaced file is a silent no-op.
#
# The file travels with the clone; the trust does not, because it is a per-machine
# content hash. `just rtk-setup` is what a fresh clone runs.
#
# Telemetry is machine-global too. Verified against rtk 0.44.1: consent lives in
# `~/Library/Application Support/rtk/config.toml` and a project `.rtk/config.toml`
# carrying `[telemetry] enabled = false` changed nothing in `rtk telemetry status`. No
# template can set it, so the setup recipe runs `rtk telemetry disable`.
