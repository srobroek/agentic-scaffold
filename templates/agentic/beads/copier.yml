_subdirectory: template
_answers_file: .copier-answers.beads.yml

_scaffold:
  summary: >-
    Beads issue tracking through `bd init --skip-hooks`, plus the .gitignore.d and
    .just.d fragments the aggregating layers fold in.
  requires_bin: [git, bd]
  # docs/agents first: bd appends a marked block to an existing AGENTS.md and keeps
  # the CLAUDE.md symlink, but writes its own beads-only file when neither exists.
  after: [base/repo, docs/agents]
  precheck: precheck.py

bd_prefix:
  type: str
  help: >-
    Issue id prefix. Empty uses the destination directory name. Every id carries it,
    so keep it short.
  default: ""

bd_dolt_sync:
  type: str
  choices: [git-origin, local-only]
  help: >-
    git-origin wires a Dolt remote from the repo's git origin, which is what makes
    the database survive a reclone. local-only keeps it on this machine.
  default: git-origin

# `sync.remote` is the one property every repository with beads sets, surveyed across
# five: agentic-packages, claudebroker, platevault, skymath, slopvac. It carries a
# `git+ssh://` or `git+https://` prefix, which is what marks it as a Dolt remote over
# the git transport rather than a git remote.
bd_sync_remote:
  type: str
  help: >-
    Dolt remote the database pushes to, shaped `git+ssh://git@host/owner/repo.git` or
    `git+https://host/owner/repo.git`. Empty derives it from the git origin.
  default: ""

bd_auto_export:
  type: bool
  help: >-
    Export .beads/issues.jsonl after writes. A viewer such as bv needs it; the Dolt
    database stays the source of truth either way. Set in slopvac.
  default: false

# `batch` defers Dolt commits to `bd dolt commit`, so a run of writes becomes one
# commit rather than one per write. Set in platevault.
bd_dolt_auto_commit:
  type: str
  choices: [off, "on", batch]
  help: >-
    Dolt commit policy. `on` commits after each write, `batch` defers to
    `bd dolt commit`, `off` leaves the working set alone.
  default: "on"

# A direct `bd dolt push` hangs on a machine where the database runs in a container:
# the guard reports "will hang until it times out" and names a wrapper. Setting this
# makes the beads package's own automatic push go through the wrapper too.
bd_push_command:
  type: str
  help: >-
    Command the automatic push runs instead of `bd`, for a machine where the database
    lives in a container. Empty leaves `bd` in charge.
  default: ""

bd_sync_hook:
  type: str
  choices: [pre-push, pre-commit, none]
  help: >-
    When the database is pushed. pre-push is the default: a commit is local, so pushing
    per commit is work nobody is waiting on, while a git push is the moment the
    database has to travel with it.
  default: pre-push

# `--skip-hooks` is not an answer. bd's five git hooks are reproduced as prek
# entries by quality/hooks, and letting bd install its own repoints
# core.hooksPath at .beads/hooks. That copy also picks up whatever hook binaries
# are ambient, which is how a 347MB git-defender copy with an unusable arm64 slice
# ended up blocking every commit.
#
# `--skip-agents` is not offered either, and is never passed. It would remove the
# four codex lifecycle hooks and the Claude SessionStart entry, which reload beads
# context after compaction. Those hooks are what make an AGENTS.md carrying no beads
# prose safe. bailiff's version passed it unconditionally.
_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/tasks/bd_init.py"
    "{{ _copier_conf.dst_path }}"
    --prefix "{{ bd_prefix }}"
    --dolt-sync "{{ bd_dolt_sync }}"
    --sync-remote "{{ bd_sync_remote }}"
    --dolt-auto-commit "{{ bd_dolt_auto_commit }}"
    --push-command "{{ bd_push_command }}"
    {% if bd_auto_export %}--auto-export{% endif %}
