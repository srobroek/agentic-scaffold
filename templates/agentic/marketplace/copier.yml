_subdirectory: template
_answers_file: .copier-answers.marketplace.yml

_scaffold:
  summary: >-
    Reads the finished tree and reports which marketplaces to register and which packages
    suit the layers that rendered. Writes no per-harness configuration file.
  requires_bin: [git]
  # Runs last, after every other layer, because it reads what they left behind. A
  # recommendation made before the tree exists is a recommendation about nothing.
  after:
    - base/gitignore
    - workspace/just
    - agentic/apm

# No variables. What to recommend follows from what rendered, and asking would let the
# answer disagree with the tree.

# The report is a task rather than a template, because the layer's whole output is a
# reading of the destination. Nothing is written: per-harness configuration comes from a
# marketplace, so this layer ships no .claude/settings.json, .mcp.json,
# .codex/config.toml, marketplace.json, opencode.json, or kiro file. Installing silently
# is the thing it exists not to do.
_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/tasks/recommend.py"
    "{{ _copier_conf.dst_path }}"
