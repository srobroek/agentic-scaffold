_subdirectory: template
_answers_file: .copier-answers.moon.yml

_scaffold:
  summary: >-
    moon over an existing workspace: the project graph, the toolchain declaration, a
    moon.yml per member generated from the manifest's own glob, and the recipes that
    run affected-only builds.
  requires_bin: [git]
  # The workspace manifest has to exist first: the member glob is read from it rather
  # than asked, so this cannot precede workspace/monorepo.
  after: [workspace/monorepo, lang/*]

# The project graph and the toolchain become the project's own once tuned. A member's
# moon.yml is regenerated by `just moon-sync`, which preserves anything outside its
# markers.
_skip_if_exists:
  - .moon/workspace.yml
  - .moon/toolchain.yml

layout:
  type: str
  choices: [rust, python, go, ts]
  help: >-
    Which workspace mechanism the root manifest uses. It decides where members live
    and which moon toolchain is declared.

project_name:
  type: str
  help: The workspace name, used in the generated graph's comments.
  default: ""

# Not asked. Every mechanism resolves members through a glob in the root manifest, so
# asking would let the answer disagree with the manifest. `gen_moon.py` reads it the
# same way scripts/add_member.py does.
members:
  type: str
  help: >-
    Glob the root manifest lists as its member path. Empty derives it from the
    manifest, which is the normal case; set it only when the manifest is unusual.
  default: ""

moon_version:
  type: str
  help: >-
    moon version the mise fragment pins. 2.x renamed a project's `type` key to
    `layer`, so an older CLI rejects the generated files.
  default: "2.4.6"

node_version:
  type: str
  help: >-
    Node version moon's own toolchain declares. moon runs its javascript tasks through
    this rather than an ambient node.
  default: "24"
  when: "{{ layout == 'ts' }}"

# `moon run` is not a copier task. It resolves the project graph and may reach the
# network for its toolchain, so a render that had otherwise succeeded would fail on
# it. `just moon-sync` generates the per-member files instead.
_tasks:
  - >-
    python3 "{{ _copier_conf.dst_path }}/scripts/gen_moon.py"
    "{{ _copier_conf.dst_path }}"
    {% if members %}--members "{{ members }}"{% endif %}
