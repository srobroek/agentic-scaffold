_subdirectory: template

_answers_file: .copier-answers.just.yml

_scaffold:
  summary: >-
    The root justfile, carrying one optional import per .just.d fragment plus the
    aggregate recipes that dispatch to whichever language layers rendered.
  requires_bin: [just]
  # Aggregates what every other layer contributed, so it renders late. Only
  # base/gitignore and agentic/marketplace follow it.
  after: [lang/*, quality/hooks, agentic/index]

# Every render rebuilds the justfile, so a new layer's fragment reaches the import
# block. Project-specific recipes belong in a fragment of their own, which
# `just-add` creates and no render touches.
#
# Which recipes exist follows from which fragments are present, so the layer needs
# no variables. Each import is optional, and a fragment that never rendered costs
# nothing.
#
# The import block is written by the copy in the generated project, so `just-sync`
# and the render cannot disagree about what is imported.
_tasks:
  - >-
    python3 "{{ _copier_conf.dst_path }}/scripts/gen_justfile.py"
    "{{ _copier_conf.dst_path }}"
