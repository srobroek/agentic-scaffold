_subdirectory: template
_answers_file: .copier-answers.worktrunk.yml

_scaffold:
  summary: >-
    Worktrunk project config and .worktreeinclude, so a fresh worktree starts warm
    and the pre-merge gate runs this repository's own checks.
  requires_bin: [git]
  after: [base/repo, workspace/just]

_skip_if_exists:
  - .worktreeinclude

forge_platform:
  type: str
  help: >-
    Named explicitly because it cannot be detected from an SSH alias or a
    self-hosted host.
  choices: [github, gitlab, gitea, azure-devops]
  default: github

forge_hostname:
  type: str
  help: >-
    API host for a self-hosted forge. Leave empty for github.com or gitlab.com.
  default: ""

setup_command:
  type: str
  help: >-
    Blocking pre-start command that makes a new worktree usable. Runs after the
    user config's mise trust, and after copy-ignored has warmed the caches.
    Derived from the language layers: uv sync, bun install, cargo fetch, go mod
    download, or a just recipe wrapping them.
  default: "just setup"

dev_server:
  type: bool
  help: >-
    Whether this project runs a dev server. Adds a hash_port-derived port to the
    wt list URL column and a post-start hook, both branch-stable.
  default: false

dev_command:
  type: str
  help: Command that starts the dev server, given a PORT environment variable.
  default: "just dev"
  when: "{{ dev_server }}"

worktree_includes:
  type: yaml
  help: >-
    Gitignore-style patterns naming what a new worktree copies from the primary
    checkout. It narrows rather than adds: a path must be both gitignored and
    listed here. Derived from the language layers that rendered.
  default: []
