_subdirectory: template
_answers_file: .copier-answers.agents.yml
_skip_if_exists:
- docs/agents/conventions.md
- docs/agents/gotchas/*.md
project_name:
  type: str
  help: The project name, used in the generated index.
_scaffold:
  summary: Steering directories under docs/agents, with generated blocks the steering
    skill rewrites, plus AGENTS.md and the CLAUDE.md symlink.
  after:
  - base/repo

# AGENTS.md is a copy of the body rather than a symlink to it: agentic/beads appends
# a marked block to AGENTS.md, and a symlink would write that block into the body.
# CLAUDE.md is a relative symlink, so one file serves both harnesses.
_tasks:
- >-
  python3 "{{ _copier_conf.src_path }}/tasks/install_agents_index.py"
  "{{ _copier_conf.dst_path }}"
