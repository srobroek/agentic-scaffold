[tools]
python = "3.13"
uv = "latest"
just = "latest"
"cargo:gitnr" = "latest"
prek = "latest"

# The structural linters `just lint-config` runs over this repository's own configuration.
# The layers put these in a generated project's CI; a scaffold that does not run them on
# itself is a scaffold whose own YAML and workflows are unchecked.
# 1.38.0, not 1.38.1: that version does not exist on PyPI. CI failed on
# `Failed to install pipx:yamllint@1.38.1` while `just lint-config` passed locally, because a
# python install had an unrelated yamllint 1.37.1 earlier on PATH.
yamllint = "1.38.0"
taplo = "0.10.0"
actionlint = "1.7.12"
zizmor = "1.28.0"

# The tests render a layer and run the real tool against the result, which is what catches a
# defect a template read cannot. A test skips rather than failing when its tool is absent,
# so an unpinned toolchain here means a green run that checked less than it appears to.
#
# Pinned to the versions the assertions were written against: several of these tests encode
# a behaviour that differs by version, moon 2.x's renamed keys and tflint's config discovery
# among them.
opentofu = "1.12.5"
tflint = "0.64.0"
vacuum = "0.30.0"
hadolint = "2.14.0"
# `latest`, deliberately, unlike everything else in this block. trivy's findings come from a
# vulnerability database rather than from its own behaviour, and no test here asserts a
# specific finding, so a pin would only mean an older scanner.
trivy = "latest"
"npm:@moonrepo/cli" = "2.4.6"
"ubi:oasdiff/oasdiff" = "1.26.1"

# Language runtimes the tests need to render a layer at all, not just to exercise it. A layer
# declaring `requires_bin` refuses to render without it, so an absent runtime fails the test
# rather than skipping it: 15 tests failed in CI on `lang/ts needs bun on PATH` and
# `agentic/beads needs bd on PATH` while passing locally, where all four happened to be
# installed. Pinned to what the assertions were written against.
bun = "1.3.13"
node = "24.13.0"
go = "1.26.2"
"aqua:gastownhall/beads" = "1.1.2"
