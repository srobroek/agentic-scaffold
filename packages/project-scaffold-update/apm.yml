name: project-scaffold-update
version: 0.1.0
description: >-
  Change a repository that already exists: adopt a layer it does not have, re-render a layer
  whose template moved, or retrofit onto a repository that predates this tool. copier update
  does not work here, since a layer rendered from a local path records no _commit, so the
  method is re-render plus git diff.
author: Sjors Robroek
license: Apache-2.0
target: all
includes: auto
category: workflow
tags:
  - skill
  - scaffolding
