[project]
name = "project-scaffold"
version = "0.1.0"
description = "Layered copier templates and an agent skill that scaffolds a repository"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "copier>=9.16",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
# Vendored verbatim from another repository, which lints it under its own rule set.
# Reformatting a copy to satisfy this one breaks byte-fidelity with the source, so the
# next re-sync would silently revert the change -- and the copy's own header says not to
# edit it. Excluded rather than annotated, because the `noqa` codes the source needs are
# themselves unused-noqa findings here.
extend-exclude = ["templates/agentic/beads/template/scripts/render_adrs.py"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
