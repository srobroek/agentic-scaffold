[project]
name = "project-scaffold"
version = "0.1.0"
description = "A Copier template and planning tools for new repositories"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "copier>=9.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
