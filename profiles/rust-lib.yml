# rust-lib -- a niche Rust library. 12 of 54 repositories are rust, and the lib/app split
# decides the licence and whether Cargo.lock is committed.
name: rust-lib
summary: A Rust library crate, published to crates.io.

generator: cargo new --lib

layers:
  - base/license
  - base/repo
  - lang/rust
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - agentic/apm
  - agentic/beads
  - agentic/index
  - quality/hooks
  - workspace/just
  - base/gitignore
  - agentic/marketplace

answers:
  # A niche library has no substitute, so copyleft friction is zero.
  license: mpl-2.0
  crate_kind: lib
  rust_edition: "2024"
  release_type: rust

# Only what the LAYERS produce. render_profile.py does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a layer got wrong. The agent
# runs the generator, and `just check` proves the layer set.
build:
  - just just-check
