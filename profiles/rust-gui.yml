# rust-gui -- a Tauri desktop application. 3 of 54 repositories are rust plus ts, and all
# three are Tauri, which is why this is a profile rather than an answer to rust-app.
#
# It is a monorepo by construction: the shell is a ts package under apps/ and the core is a
# crate under crates/, so the workspace layer is not optional here.
name: rust-gui
summary: A Tauri desktop application, Rust core with a TypeScript shell.

# Two generators in sequence. create-tauri-app runs at apps/<name> after the workspace
# root exists, because a monorepo renders the root manifest first: `cargo init .` would
# write a [package] root and no [workspace] section would ever be written.
generator: cargo new
generator_then: create-tauri-app at apps/<name>

layers:
  - base/license
  - base/repo
  - workspace/monorepo
  - lang/rust
  - lang/ts
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - agentic/beads
  - agentic/index
  - quality/hooks
  - workspace/moon
  - workspace/just
  - base/gitignore

answers:
  license: agpl-3.0-only
  layout: rust
  members: "crates/*"
  crate_kind: bin
  rust_edition: "2024"

# Read by the agent when it runs the generator; no recipe asks it. The shell needs no
# starlight: docs/site supersedes it, and the addon is off by default.
generator_answers:
  ts_framework: none

# Only what the RECIPES produce. `scaffold render` does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a recipe got wrong. The agent
# runs the generator, and `just check` proves the recipe set.
build:
  - just moon-check
  - just just-check
