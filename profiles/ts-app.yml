# ts-app -- a TypeScript application. 7 of 54 repositories are ts.
#
# better-t-stack generates the project and already writes biome.json and tsconfig.json, so
# lang/ts guards both with _skip_if_exists and contributes only its fragments and CI jobs.
name: ts-app
summary: A TypeScript web application.

# create-json, not the flag form: --yes rejects any stack flag, and addonOptions has no
# flag equivalent.
generator: create-better-t-stack create-json

layers:
  - base/license
  - base/repo
  - lang/ts
  - lang/api
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - docs/site
  - docs/deploy-sibling
  - agentic/apm
  - agentic/beads
  - agentic/index
  - container/image
  - quality/hooks
  - workspace/just
  - base/gitignore
  - agentic/marketplace

answers:
  license: agpl-3.0-only
  node_version: "24"
  ts_typeaware: true
  release_type: node
  container_language: ts
  container_runtime_base: distroless
  docs_engine: starlight
  # starlight is off as a better-t-stack addon, because docs/site supersedes it.

  # The generator's own axes, verified against `create-better-t-stack schema`. api is orpc
  # rather than trpc because orpc emits an OpenAPI document and trpc emits none, which is
  # what makes lang/api's vacuum and oasdiff gates mean anything here. database, orm, auth,
  # and payments are asked rather than derived, so `none` is the starting point.
  bts_frontend: tanstack-router
  bts_backend: hono
  bts_runtime: bun
  bts_api: orpc
  bts_addons: [biome, turborepo]

# Only what the RECIPES produce. `scaffold render` does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a recipe got wrong. The agent
# runs the generator, and `just check` proves the recipe set.
build:
  - just api-lint
  - just just-check
