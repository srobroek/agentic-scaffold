# rust-app -- a Rust binary. Differs from rust-lib in the licence, the crate kind, and
# whether Cargo.lock is committed: a binary commits it so a build is reproducible, a
# library ignores it so a consumer resolves its own.
name: rust-app
summary: A Rust application, shipped as a binary.

generator: cargo new

layers:
  - base/license
  - base/repo
  - lang/rust
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - agentic/beads
  - agentic/index
  - quality/hooks
  - workspace/just
  - base/gitignore

answers:
  # An application, so fork-plus-SaaS protection at no adoption cost.
  license: agpl-3.0-only
  crate_kind: bin

# Only what the RECIPES produce. `scaffold render` does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a recipe got wrong. The agent
# runs the generator, and `just check` proves the recipe set.
build:
  - just just-check
