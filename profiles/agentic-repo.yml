# agentic-repo -- the largest shape in the survey at 17 of 54 repositories, and the one
# the old catalog had no name for: a repository whose product is skills, agents, steering,
# or a marketplace, with no language layer at all.
#
# This is the profile project-scaffold itself would render.
name: agentic-repo
summary: A repository whose product is agentic packages rather than code.

generator: none

# Order matters and is the order in docs/recipes.md states. `just check` renders in this
# sequence, so a layer that reads what an earlier one wrote has to appear after it.
layers:
  - base/license
  - base/repo
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - agentic/package
  - agentic/beads
  - agentic/index
  - quality/hooks
  - workspace/just
  - base/gitignore

# agentic/package makes the repository its own marketplace, serving OMP and Claude Code
# from one catalog source. What a machine CONSUMES is registered per user with `omp plugin
# marketplace add <owner>/<repo>`, outside any repository, so no layer here writes a
# consumer manifest and no default marketplace is seeded.

# What varies inside the profile, beyond what the six questions ask. Every key here is
# either derived per rules/choices.md or fixed for the shape.
answers:
  # A template or dev-tooling repository, per the licence policy.
  license: apache-2.0

# How `just check` proves the rendered tree is a working project rather than only a tree
# that rendered. Each command runs in the destination and must exit 0.
# Only what the RECIPES produce. `scaffold render` does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a recipe got wrong. The agent
# runs the generator, and `just check` proves the recipe set.
build:
  # The catalogs are written at render time by the generator the layer ships, so the check
  # is the whole proof: it compares the committed bytes against what the plugin manifests
  # imply, and a render that got either side wrong fails here rather than at install time.
  - just marketplace-check
  - just just-check
