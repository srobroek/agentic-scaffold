# cdk -- an AWS CDK application. projen owns the CDK and TypeScript build surface; the
# layers own CI, hooks, agentic, release, and licence.
name: cdk
summary: An AWS CDK application, owned by projen.

# `projen new` writes a ts-node task and the synth that would replace it is the thing that
# fails under TypeScript 7, so the bootstrap installs tsx and runs .projenrc.ts through it
# once directly. `just cdk-bootstrap-projen` does exactly that.
generator: projen new awscdk-app-ts

layers:
  - base/repo
  - lang/ts
  # Before host/github: its re-synth task runs projen with `github: false` and
  # `licensed: false`, removing the read-only github component and the Apache-2.0
  # LICENSE `projen new` synthesised, so the host layer can own .github and
  # base/license -- rendered after for exactly that reason -- can own LICENSE.
  - iac/cdk
  - base/license
  - host/github
  - release/release-please
  - docs/agents
  - docs/adr
  - agentic/beads
  - agentic/index
  - quality/hooks
  - workspace/just
  - base/gitignore

answers:
  license: agpl-3.0-only
  node_version: "24"
  # The root shape lies here: projen owns package.json and regenerates it, so a
  # node release-type editing its version would fight the generator. simple keeps
  # the version in version.txt, which nothing else owns.
  release_type: simple
  # github: false in .projenrc.ts, so the host layer's reusable workflows are the only CI.

# Only what the RECIPES produce. `scaffold render` does not run the generator, so a
# command needing generator output (cargo build, go build, a projen synth) would fail
# for the absence of a manifest rather than for anything a recipe got wrong. The agent
# runs the generator, and `just check` proves the recipe set.
build:
  - just just-check
