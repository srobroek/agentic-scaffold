name: CI

# This repository's own gate. It runs `just check`, which is the same command a contributor
# runs: lint, the prose gate, the generated-file checks, the profile validator, and the
# tests.
#
# Not the reusable-workflow shape the host layer renders for a scaffolded project. That
# shape exists to compose per-language jobs a caller wires; here there is one language and
# one command, so a caller indirection would add a file without adding a check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same ref supersedes the first. Two refs never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    # GitHub defaults to 360 minutes, so a hung job burns six runner hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history: the tests render profiles and read refs, and the prose gate
          # compares against the base.
          fetch-depth: 0
          # The default leaves GITHUB_TOKEN in .git/config, where any later step can read
          # it. zizmor reports the default as a finding.
          persist-credentials: false

      - name: Install the toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true

      # tflint fetches its aws ruleset from the GitHub API, which rate-limits an
      # unauthenticated runner: a 403 leaves every directory reporting "Plugin not found".
      - name: Check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just check

  # The only required status check. It exists so branch protection names one job rather
  # than every job: adding a job above needs no change to the protection rule.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Verify every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A skipped or cancelled job is not a pass. `always()` above is what lets this job
          # report at all when an upstream job failed.
          #
          # The results arrive through the environment rather than a pipe: a heredoc would
          # override piped stdin, which shellcheck reports as SC2259.
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in needs.items() if job.get("result") != "success"]
          if failed:
              print(f"::error::these jobs did not succeed: {' '.join(failed)}")
              sys.exit(1)
          print("every job passed")
          PY
