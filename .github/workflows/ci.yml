name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063b0c4e6d4e3d6ab0b7b0a2bc15d6eaa1a # v6
        with:
          enable-cache: true
      - run: yamllint .github/workflows/ci.yml
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uvx --from slopvac==1.0.1 slopvac README.md docs --profile normal
      - run: actionlint .github/workflows/*
