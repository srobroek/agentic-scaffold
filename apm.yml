name: project-scaffold
version: 0.2.2
description: >-
  Config-driven project scaffolding as composable copier layers. 36 layers
  covering git, CI, quality gates, release, docs, infrastructure, containers,
  and agentic tooling, with 13 profiles naming which layers a shape renders and
  in what order. The project-scaffold skill runs the interview, derives what
  rules/choices.md marks derived, and renders a profile end to end.
author: Sjors Robroek
license: Apache-2.0
type: hybrid
# Where compiled skills and steering deploy. kiro is a target rather than a marketplace
# output, because apm ships no kiro marketplace mapper.
#
# release-please rewrites this file to bump `version` and its YAML writer drops comments, so
# these were lost once already at 0.2.0. `just release-restore` puts them back, and
# test_the_kiro_rationale_survives_a_release fails when neither happened.
targets:
  - claude
  - codex
  - kiro
includes: auto
marketplace:
  owner:
    name: srobroek
    url: https://github.com/srobroek
  outputs:
    claude: {}
    codex: {}
  versioning:
    strategy: tag_pattern
  build:
    tagPattern: '{name}--v{version}'
  packages:
    - name: project-scaffold
      source: ./packages/project-scaffold
      category: workflow
      tags:
        - skill
        - scaffolding
        - copier
    - name: project-scaffold-update
      source: ./packages/project-scaffold-update
      category: workflow
      tags:
        - skill
        - scaffolding
